<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封闭货车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    font-family: 'Noto Serif SC', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ── 背景流动光效 ── */
  .bg-glow {
    position: fixed;
    top: -30%;
    left: -20%;
    width: 140%;
    height: 160%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(60,80,100,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(80,60,50,0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(20,30,40,0.3) 0%, transparent 70%);
    animation: glowShift 20s ease-in-out infinite;
  }

  @keyframes glowShift {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ── 页面容器 ── */
  .page {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px A20px;
  }

  /* ── 四憙印章 ── */
  .seal-wrapper {
    margin-bottom: 56px;
    animation: sealReveal 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes sealReveal {
    0%   { opacity: 0; transform: scale(0.5) rotate(-8deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .seal-svg {
    width: clamp(80px, 16vw, 110px);
    height: clamp(80px, 16vw, 110px);
    filter: drop-shadow(0 0 20px rgba(180,60,50,0.2));
  }

  /* ── 导航区 ── */
  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 36px;
    align-items: center;
  }

  .nav-item {
    opacity: 0;
    animation: navFadeIn 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    text-align: center;
  }

  .nav-item:nth-child(1) { animation-delay: 0.4s; }
  .nav-item:nth-child(2) { animation-delay: 0.6s; }
  .nav-item:nth-child(3) { animation-delay: 0.8s; }

  @keyframes navFadeIn {
    0%   { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .nav-link {
    display: block;
    text-decoration: none;
    color: rgba(255,255,255,0.82);
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    letter-spacing: 12px;
    padding: 14px 28px;
    transition: color 0.5s ease,
                text-shadow 0.5s ease,
                letter-spacing 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
  }

  .nav-link:hover {
    color: #e8c4a0;
    text-shadow: 0 0 40px rgba(220,180,140,0.3);
    letter-spacing: 16px;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 40px;
    height: 1px;
    background: rgba(200,160,120,0.4);
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .nav-link:hover::after {
    transform: translateX(-50%) scaleX(1);
  }

  /* ── 导航副标题 ── */
  .nav-sub {
    display: block;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10px;
    color: rgba(255,255,255,0.22);
    letter-spacing: 4px;
    margin-top: 6px;
    font-weight: 400;
    transition: color 0.5s ease;
  }

  .nav-link:hover .nav-sub {
    color: rgba(220,180,140,0.35);
  }

  /* ── 底部标记 ── */
  .footer-mark {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 9px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 5px;
    pointer-events: none;
    opacity: 0;
    animation: fadeInLate 1.5s ease 1.2s both;
  }

  @keyframes fadeInLate {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* ── 移动端适配 ── */
  @media (max-width: 500px) {
    .page { padding: 40px 20px; }
    .nav-list { gap: 28px; }
    .seal-wrapper { margin-bottom: 40px; }
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="page">

    <!-- "四憙" 印章 -->
    <div class="seal-wrapper">
      <svg class="seal-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="24" y="24" width="152" height="152" rx="5" ry="5"
              fill="#c8322a" stroke="#8a1a1a" stroke-width="2.5"/>
        <rect x="38" y="38" width="124" height="124" rx="2" ry="2"
              fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
        <text x="100" y="125"
              font-family="'Noto Serif SC','SimSun',serif"
              font-size="96" font-weight="900"
              fill="#f0e8e0"
              text-anchor="middle">憙</text>
        <rect x="24" y="24" width="152" height="152" rx="5" ry="5"
              fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="7"
              stroke-dasharray="3 16 2 10 1 7" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 导航 -->
    <nav>
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link" href="feed.html">
            发自天然
            <span class="nav-sub">a diary of moments</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="stream.html">
            流芳
            <span class="nav-sub">whispers to the lake</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="audio.html">
            锵锵
            <span class="nav-sub">a sound of resonance</span>
          </a>
        </li>
      </ul>
    </nav>

  </div>

  <div class="footer-mark">xiqianyangyi · 封闭货车</div>

</body>
</html>
