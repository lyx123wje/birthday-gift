<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流芳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0d10;
    font-family: 'Noto Serif SC', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 湖面背景 ── */
  .lake-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        #1a2a3a 0%,
        #1e3a4a 30%,
        #1a3a4a 50%,
        #162e3e 70%,
        #12242e 100%);
  }

  /* ── 水面波纹 ── */
  .water-ripple {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    opacity: 0.15;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 40px,
      rgba(180,200,220,0.12) 40px,
      rgba(180,200,220,0.12) 41px
    );
    animation: waterFlow 4s ease-in-out infinite;
  }

  @keyframes waterFlow {
    0%, 100% { transform: translateY(0); opacity: 0.12; }
    50% { transform: translateY(-8px); opacity: 0.2; }
  }

  /* ── 月光 ── */
  .moonlight {
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220,230,240,0.25) 0%, transparent 70%);
    z-index: 2;
    pointer-events: none;
    animation: moonFloat 8s ease-in-out infinite;
  }

  @keyframes moonFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-12px); }
  }

  /* ── 垃圾桶 SVG ── */
  .trash-container {
    position: fixed;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    opacity: 0.85;
    animation: trashFloat 5s ease-in-out infinite;
    cursor: pointer;
    transition: opacity 0.5s ease;
  }

  .trash-container:hover {
    opacity: 1;
  }

  @keyframes trashFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    60% { transform: translateX(-50%) translateY(-6px); }
  }

  .trash-svg {
    width: clamp(120px, 30vw, 180px);
    height: auto;
  }

  /* ── 页面标题 ── */
  .page-title {
    position: fixed;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    color: rgba(220,230,240,0.7);
    letter-spacing: 14px;
    text-align: center;
    animation: titleIn 1.4s ease both;
  }

  @keyframes titleIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .page-sub {
    display: block;
    font-family: Georgia, serif;
    font-size: 10px;
    color: rgba(180,200,220,0.3);
    letter-spacing: 5px;
    font-weight: 400;
    margin-top: 8px;
  }

  /* ── 返回链接 ── */
  .back-link {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 20;
    font-family: Georgia, serif;
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    text-decoration: none;
    letter-spacing: 2px;
    transition: color 0.4s;
  }

  .back-link:hover { color: rgba(255,255,255,0.55); }

  /* ── 提示文字 ── */
  .hint {
    position: fixed;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: Georgia, serif;
    font-size: 10px;
    color: rgba(180,200,220,0.2);
    letter-spacing: 3px;
    animation: fadeIn 2s ease 1s both;
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="lake-bg"></div>
  <div class="water-ripple"></div>
  <div class="moonlight"></div>

  <a class="back-link" href="subIndex.html">← 返回</a>

  <div class="page-title">
    流芳
    <span class="page-sub">whispers to the lake</span>
  </div>

  <!-- 简笔画垃圾桶 -->
  <div class="trash-container" title="投递情绪纸团">
    <svg class="trash-svg" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="28" rx="30" ry="8" fill="none" stroke="rgba(200,210,220,0.5)" stroke-width="1.5"/>
      <line x1="30" y1="28" x2="24" y2="18" stroke="rgba(200,210,220,0.45)" stroke-width="1.3"/>
      <line x1="90" y1="28" x2="96" y2="18" stroke="rgba(200,210,220,0.45)" stroke-width="1.3"/>
      <line x1="24" y1="18" x2="96" y2="18" stroke="rgba(200,210,220,0.4)" stroke-width="1.2"/>
      <line x1="36" y1="28" x2="36" y2="130" stroke="rgba(200,210,220,0.5)" stroke-width="1.2"/>
      <line x1="84" y1="28" x2="84" y2="130" stroke="rgba(200,210,220,0.5)" stroke-width="1.2"/>
      <line x1="36" y1="130" x2="84" y2="130" stroke="rgba(200,210,220,0.4)" stroke-width="1"/>

      <!-- 漂浮纸团 -->
      <g opacity="0.35">
        <ellipse cx="72" cy="50" rx="5" ry="3" fill="none" stroke="rgba(240,240,235,0.5)" stroke-width="0.8" transform="rotate(15,72,50)"/>
      </g>
      <g opacity="0.25">
        <ellipse cx="48" cy="70" rx="4" ry="2.5" fill="none" stroke="rgba(240,240,235,0.4)" stroke-width="0.7" transform="rotate(-20,48,70)"/>
      </g>
    </svg>
  </div>

  <div class="hint">把你的情绪写下来，扔进湖里</div>

</body>
</html>
