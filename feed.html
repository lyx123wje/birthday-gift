<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="xiaoxiong.jpg" type="image/jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二十一一</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── 隐藏滚动条 ── */
  ::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {
    background: #0d0d0d;
    font-family: Georgia, 'Times New Roman', 'Noto Serif SC', serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 视频背景 · 完全不可交互 ── */
  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: #0d0d0d;
  }

  /* ── 背景遮罩（让内容更清晰） ── */
  .bg-veil {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: rgba(0,0,0,0.03);
  }

  .wrapper {
    max-width: 380px;
    margin: 0 auto;
    background: transparent;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* ── 顶部固定栏 · 毛玻璃 ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 20px 28px 16px 28px;
    background: rgba(18, 18, 18, 0.55);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    color: #e8e4dc;
    letter-spacing: 10px;
    text-align: left;
    user-select: none;
  }

  .header-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
    transition: opacity 0.3s ease;
  }

  .header-link:hover {
    opacity: 0.5;
  }

  /* ── Feed 流 ── */
  .feed {
    padding: 28px 0 80px 0;
  }

  .feed-item {
    padding: 20px 18px;
    margin-bottom: 72px;
    background: transparent;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .feed-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* 第一项初始可见 */
  .feed-item:first-child {
    margin-top: 24px;
    opacity: 1;
    transform: none;
  }

  .feed-image {
    width: 50%;
    display: block;
    margin: 0 auto;
    object-fit: cover;
    border-radius: 1px;
    background: #eae8e3;
    min-height: 160px;
    transition: filter 0.6s ease;
  }

  /* ── 视频容器 ── */
  .video-wrapper {
    position: relative;
    width: 50%;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  .video-wrapper video.feed-image {
    width: 100%;
    margin: 0;
    pointer-events: auto;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 红色三角播放按钮（视觉装饰，不拦截触摸） */
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    border-left: 28px solid rgba(100,140,220,0.85);
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.25s ease;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
  }

  .play-btn.hidden { opacity: 0; }

  /* 抽象画占位色 */
  .img-fallback-0 { background: #1a1a1a; aspect-ratio: 1/1; display:flex;align-items:center;justify-content:center; }
  .img-fallback-1 { background: #e8c4c4; aspect-ratio: 3/4; }
  .img-fallback-2 { background: #c4b89a; aspect-ratio: 4/3; }
  .img-fallback-3 { background: #d4cfc8; aspect-ratio: 1/1; }
  .img-fallback-4 { background: #b8c8c0; aspect-ratio: 3/4; }
  .img-fallback-5 { background: #c8c4d4; aspect-ratio: 4/3; }
  .img-fallback-6 { background: #d8d0c4; aspect-ratio: 1/1; }
  .img-fallback-7 { background: #a8b4c0; aspect-ratio: 3/4; }
  .img-fallback-8 { background: #c8b8a8; aspect-ratio: 4/3; }
  .img-fallback-9 { background: #d4d4cc; aspect-ratio: 3/4; }
  .img-fallback-10 { background: #c0b8a8; aspect-ratio: 1/1; }
  .img-fallback-11 { background: #d0ccc8; aspect-ratio: 4/3; }
  .img-fallback-12 { background: #c4c0b8; aspect-ratio: 3/4; }

  /* ── 日期时间戳 ── */
  .feed-date {
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10.5px;
    color: #b5aca0;
    letter-spacing: 0.8px;
    text-align: center;
    line-height: 1.6;
  }

  /* ── 可选的文字描述 ── */
  .feed-caption {
    margin-top: 8px;
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 12.5px;
    color: #9a9085;
    line-height: 1.9;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ── 分隔呼吸线 ── */
  .feed-divider {
    height: 1px;
    margin: 0 18px 48px 18px;
    background: transparent;
  }

  /* ── 移动端适配 ── */
  @media (max-width: 500px) {
    .wrapper { max-width: 100%; }
    .feed-item { padding: 14px 12px; margin-bottom: 56px; }
    .feed-image { width: 60%; }
    .video-wrapper { width: 60%; }
    .sticky-header { padding: 18px 16px 14px 16px; font-size: 20px; letter-spacing: 8px; }
  }
</style>
</head>
<body>

<!-- 背景视频由 JS 动态创建，避免 HTML 标签被夸克等浏览器拦截 -->

<div class="bg-veil"></div>

<div class="wrapper">

  <header class="sticky-header"><a href="index.html" class="header-link">二十一一</a></header>

  <main class="feed">

    <!-- ====== Feed Item 1 ====== -->
    <div class="feed-item">
      <img class="feed-image"
           src="moments/post3/img_20220102.jpg"
           alt=""
           loading="lazy">
      <div class="feed-date">2022.1.2 &nbsp; 22:51</div>
      <div class="feed-caption">( ⁃ᴗ• )</div>
    </div>

    <!-- ====== Feed Item 2 ====== -->
    <div class="feed-item">
      <img class="feed-image"
           src="moments/post2/img_20211204.jpg"
           alt=""
           loading="lazy">
      <div class="feed-date">2021.12.4 &nbsp; 20:50</div>
      <div class="feed-caption">见到想见的人啦</div>
    </div>

    <!-- ====== Feed Item 3 ====== -->
    <div class="feed-item">
      <div class="video-wrapper">
        <video class="feed-image" src="moments/post1/video_20210411.mp4"
               autoplay muted loop playsinline></video>
        <div class="play-btn"></div>
      </div>
      <div class="feed-date">2021.4.11 &nbsp; 22:59</div>
    </div>

  </main>

</div>

<script>
(function() {
  // ═══════════════════════════════════════════════
  // JS 动态创建背景视频 — 绕过浏览器 HTML 解析拦截
  // ═══════════════════════════════════════════════
  var bgVideo = document.createElement('video');
  bgVideo.id = 'bgVideo';
  bgVideo.className = 'video-bg';
  bgVideo.src = 'bg_video.mp4';
  bgVideo.muted = true;
  bgVideo.loop = true;
  bgVideo.autoplay = true;
  bgVideo.playsInline = true;
  bgVideo.setAttribute('webkit-playsinline', '');
  bgVideo.setAttribute('x5-video-player-type', 'h5-page');
  bgVideo.setAttribute('x5-video-player-fullscreen', 'false');
  bgVideo.setAttribute('x5-video-orientation', 'portrait');
  bgVideo.setAttribute('disablePictureInPicture', '');
  bgVideo.setAttribute('disableRemotePlayback', '');
  bgVideo.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
  bgVideo.setAttribute('oncontextmenu', 'return false');
  bgVideo.setAttribute('preload', 'auto');
  bgVideo.setAttribute('playsinline', '');

  // 插入到 body 最前面
  document.body.insertBefore(bgVideo, document.body.firstChild);

  // 尝试自动播放
  function tryPlay() {
    var p = bgVideo.play();
    if (p) {
      p.catch(function() {
        document.addEventListener('touchstart', playOnTouch, { once: true });
        document.addEventListener('click', playOnTouch, { once: true });
      });
    }
  }

  function playOnTouch() {
    bgVideo.play().catch(function(){});
  }

  tryPlay();

  // 页面从后台恢复时续播
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && bgVideo.paused) {
      bgVideo.play().catch(function(){});
    }
  });

  // ── 朋友圈视频：htmlPreventDefault 拦截触控，手动切换播放/暂停/声音 ──
  var wrappers = document.querySelectorAll('.video-wrapper');
  wrappers.forEach(function(wrapper) {
    var video = wrapper.querySelector('video');
    var btn   = wrapper.querySelector('.play-btn');

    video.muted = true;
    video.loop = true;

    // 自动播放静音 → 按钮保持可见（提示用户点按出声音）
    video.play().catch(function() {
      btn.classList.remove('hidden');
    });

    // 核心：在 video 上监听 touchstart，preventDefault 阻止 Safari 原生行为
    function toggleVideo() {
      if (video.paused) {
        video.muted = false;
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener('touchstart', function(e) {
      e.preventDefault();
      toggleVideo();
    });

    // PC 端用 click
    video.addEventListener('click', function(e) {
      e.preventDefault();
      toggleVideo();
    });

    // 事件同步按钮
    video.addEventListener('play',  function() {
      if (!video.muted) btn.classList.add('hidden');
    });
    video.addEventListener('pause', function() { btn.classList.remove('hidden'); });
    video.addEventListener('ended', function() { btn.classList.remove('hidden'); });
  });

  // ── Feed 淡入动画 ──
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  var items = document.querySelectorAll('.feed-item');
  items.forEach(function(item, i) {
    if (i === 0) return;
    observer.observe(item);
  });
})();
</script>


</body>
</html>
