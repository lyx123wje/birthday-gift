<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发自天然</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── 隐藏滚动条 ── */
  ::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {
    background: #0d0d0d;
    font-family: Georgia, 'Times New Roman', 'Noto Serif SC', serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 视频固定背景 ── */
  .video-bg {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    max-width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  /* ── 背景遮罩（让内容更清晰） ── */
  .bg-veil {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: rgba(0,0,0,0.03);
  }

  .wrapper {
    max-width: 380px;
    margin: 0 auto;
    background: transparent;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* ── 顶部固定栏 · 毛玻璃 ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 20px 28px 16px 28px;
    background: rgba(18, 18, 18, 0.55);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    color: #e8e4dc;
    letter-spacing: 10px;
    text-align: left;
    user-select: none;
  }

  .header-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
    transition: opacity 0.3s ease;
  }

  .header-link:hover {
    opacity: 0.5;
  }

  /* ── Feed 流 ── */
  .feed {
    padding: 28px 0 80px 0;
  }

  .feed-item {
    padding: 20px 18px;
    margin-bottom: 72px;
    background: transparent;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .feed-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* 第一项初始可见 */
  .feed-item:first-child {
    margin-top: 24px;
    opacity: 1;
    transform: none;
  }

  .feed-image {
    width: 50%;
    display: block;
    margin: 0 auto;
    object-fit: cover;
    border-radius: 1px;
    background: #eae8e3;
    min-height: 160px;
    transition: filter 0.6s ease;
  }

  video.feed-image {
    pointer-events: auto;
    outline: none;
  }

  /* 抽象画占位色 */
  .img-fallback-0 { background: #1a1a1a; aspect-ratio: 1/1; display:flex;align-items:center;justify-content:center; }
  .img-fallback-1 { background: #e8c4c4; aspect-ratio: 3/4; }
  .img-fallback-2 { background: #c4b89a; aspect-ratio: 4/3; }
  .img-fallback-3 { background: #d4cfc8; aspect-ratio: 1/1; }
  .img-fallback-4 { background: #b8c8c0; aspect-ratio: 3/4; }
  .img-fallback-5 { background: #c8c4d4; aspect-ratio: 4/3; }
  .img-fallback-6 { background: #d8d0c4; aspect-ratio: 1/1; }
  .img-fallback-7 { background: #a8b4c0; aspect-ratio: 3/4; }
  .img-fallback-8 { background: #c8b8a8; aspect-ratio: 4/3; }
  .img-fallback-9 { background: #d4d4cc; aspect-ratio: 3/4; }
  .img-fallback-10 { background: #c0b8a8; aspect-ratio: 1/1; }
  .img-fallback-11 { background: #d0ccc8; aspect-ratio: 4/3; }
  .img-fallback-12 { background: #c4c0b8; aspect-ratio: 3/4; }

  /* ── 日期时间戳 ── */
  .feed-date {
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10.5px;
    color: #b5aca0;
    letter-spacing: 0.8px;
    text-align: center;
    line-height: 1.6;
  }

  /* ── 可选的文字描述 ── */
  .feed-caption {
    margin-top: 8px;
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 12.5px;
    color: #9a9085;
    line-height: 1.9;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ── 分隔呼吸线 ── */
  .feed-divider {
    height: 1px;
    margin: 0 18px 48px 18px;
    background: transparent;
  }

  /* ── 移动端适配 ── */
  @media (max-width: 500px) {
    .wrapper { max-width: 100%; }
    .feed-item { padding: 14px 12px; margin-bottom: 56px; }
    .feed-image { width: 60%; }
    .sticky-header { padding: 18px 16px 14px 16px; font-size: 20px; letter-spacing: 8px; }
  }
</style>
</head>
<body>

<video id="bgVideo" class="video-bg" autoplay muted loop playsinline preload="auto">
  <source src="bg_video.mp4" type="video/mp4">
</video>

<div class="bg-veil"></div>

<div class="wrapper">

  <header class="sticky-header"><a href="index.html" class="header-link">发自天然</a></header>

  <main class="feed">

    <!-- ====== Feed Item 1 ====== -->
    <div class="feed-item">
      <img class="feed-image"
           src="朋友圈图片/3.( ⁃͈ᴗ•͈ ) 202201022251/微信图片_2026-05-10_030807_959.jpg"
           alt=""
           loading="lazy">
      <div class="feed-date">2022.1.2 &nbsp; 22:51</div>
      <div class="feed-caption">( ⁃ᴗ• )</div>
    </div>

    <!-- ====== Feed Item 2 ====== -->
    <div class="feed-item">
      <img class="feed-image"
           src="朋友圈图片/2.见到想见的人啦 202112042050/微信图片_2026-05-10_030413_134.jpg"
           alt=""
           loading="lazy">
      <div class="feed-date">2021.12.4 &nbsp; 20:50</div>
      <div class="feed-caption">见到想见的人啦</div>
    </div>

    <!-- ====== Feed Item 3 ====== -->
    <div class="feed-item">
      <video class="feed-image" autoplay muted loop playsinline preload="auto">
        <source src="朋友圈图片/第一条（没文案 日期：2021四月11 22：59）/微信视频2026-05-10_030148_363.mp4" type="video/mp4">
      </video>
      <div class="feed-date">2021.4.11 &nbsp; 22:59</div>
    </div>

  </main>

</div>

<script>
(function() {
  // ── 强制播放背景视频 ──
  var bgVideo = document.getElementById('bgVideo');
  if (bgVideo) {
    bgVideo.play().catch(function() {
      // 如果 autoplay 被拦截，尝试用户交互后播放
      document.addEventListener('click', function playOnce() {
        bgVideo.play();
        document.removeEventListener('click', playOnce);
      }, { once: true });
    });
  }

  // ── Feed 淡入动画 ──
  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  var items = document.querySelectorAll('.feed-item');
  items.forEach(function(item, i) {
    if (i === 0) return;
    observer.observe(item);
  });
})();
</script>

</body>
</html>
