<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon-bw.jpg" type="image/jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二十一一</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── 隐藏滚动条 ── */
  ::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {
    background: #0d0d0d;
    font-family: Georgia, 'Times New Roman', 'Noto Serif SC', serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 视频背景 · 完全不可交互 ── */
  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: #0d0d0d;
  }

  /* ── 背景遮罩（让内容更清晰） ── */
  .bg-veil {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: rgba(0,0,0,0.03);
  }

  .wrapper {
    max-width: 380px;
    margin: 0 auto;
    background: transparent;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* ── 顶部固定栏 · 毛玻璃 ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 20px 28px 16px 28px;
    background: rgba(18, 18, 18, 0.55);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    color: #e8e4dc;
    letter-spacing: 10px;
    text-align: left;
    user-select: none;
  }

  .header-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
    transition: opacity 0.3s ease;
  }

  .header-link:hover {
    opacity: 0.5;
  }

  .header-sep {
    color: #000;
    margin: 0 6px;
    user-select: none;
    pointer-events: none;
  }

  .header-link-external {
    text-decoration: none;
    color: inherit;
    transition: opacity 0.3s ease;
  }

  .header-link-external:hover {
    opacity: 0.5;
  }

  /* ── Feed 流 ── */
  .feed {
    padding: 28px 0 80px 0;
  }

  .feed-item {
    padding: 20px 18px;
    margin-bottom: 72px;
    background: transparent;
    opacity: 0;
    transform: translateY(36px) scale(0.94);
    filter: blur(4px);
    transition: opacity 1s cubic-bezier(0.16, 0.84, 0.44, 1),
                transform 1s cubic-bezier(0.16, 0.84, 0.44, 1),
                filter 1s cubic-bezier(0.16, 0.84, 0.44, 1);
  }

  .feed-item.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }

  /* 第一项初始可见 */
  .feed-item:first-child {
    margin-top: 24px;
    opacity: 1;
    transform: none;
    filter: none;
  }

  .feed-image {
    width: 50%;
    display: block;
    margin: 0 auto;
    object-fit: cover;
    border-radius: 1px;
    background: #eae8e3;
    min-height: 160px;
    transition: filter 0.6s ease;
  }

  /* ── 多图横排滚动 ── */
  .media-carousel {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    font-size: 0;
  }

  .media-carousel::-webkit-scrollbar { display: none; }

  .media-carousel img {
    display: inline-block;
    width: 42%;
    height: auto;
    object-fit: cover;
    margin: 0;
    padding: 0;
    font-size: 0;
    border: none;
    vertical-align: top;
  }

  /* ── 视频容器 ── */
  .video-wrapper {
    position: relative;
    width: 50%;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  .video-wrapper video.feed-image {
    width: 100%;
    margin: 0;
    pointer-events: auto;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 红色三角播放按钮（视觉装饰，不拦截触摸） */
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    border-left: 28px solid rgba(100,140,220,0.85);
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.25s ease;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
  }

  .play-btn.hidden { opacity: 0; }

  /* 抽象画占位色 */
  .img-fallback-0 { background: #1a1a1a; aspect-ratio: 1/1; display:flex;align-items:center;justify-content:center; }
  .img-fallback-1 { background: #e8c4c4; aspect-ratio: 3/4; }
  .img-fallback-2 { background: #c4b89a; aspect-ratio: 4/3; }
  .img-fallback-3 { background: #d4cfc8; aspect-ratio: 1/1; }
  .img-fallback-4 { background: #b8c8c0; aspect-ratio: 3/4; }
  .img-fallback-5 { background: #c8c4d4; aspect-ratio: 4/3; }
  .img-fallback-6 { background: #d8d0c4; aspect-ratio: 1/1; }
  .img-fallback-7 { background: #a8b4c0; aspect-ratio: 3/4; }
  .img-fallback-8 { background: #c8b8a8; aspect-ratio: 4/3; }
  .img-fallback-9 { background: #d4d4cc; aspect-ratio: 3/4; }
  .img-fallback-10 { background: #c0b8a8; aspect-ratio: 1/1; }
  .img-fallback-11 { background: #d0ccc8; aspect-ratio: 4/3; }
  .img-fallback-12 { background: #c4c0b8; aspect-ratio: 3/4; }

  /* ── 日期时间戳 ── */
  .feed-date {
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10.5px;
    color: #b5aca0;
    letter-spacing: 0.8px;
    text-align: center;
    line-height: 1.6;
  }

  /* ── 可选的文字描述 ── */
  .feed-caption {
    margin-top: 8px;
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 12.5px;
    color: #9a9085;
    line-height: 1.9;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ── 分隔呼吸线 ── */
  .feed-divider {
    height: 1px;
    margin: 0 18px 48px 18px;
    background: transparent;
  }

  /* ── 加载状态 ── */
  .feed-loading {
    text-align: center;
    padding: 60px 0;
  }

  .feed-loading-inner {
    display: inline-block;
    font-size: 12px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 4px;
    animation: loadingPulse 1.8s ease-in-out infinite;
  }

  @keyframes loadingPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.6; }
  }

  /* ── 空状态 ── */
  .feed-empty {
    text-align: center;
    padding: 80px 0;
    font-size: 13px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 3px;
  }

  /* ── 移动端适配 ── */
  @media (max-width: 500px) {
    .wrapper { max-width: 100%; }
    .feed-item { padding: 14px 12px; margin-bottom: 56px; }
    .feed-image { width: 60%; }
    .video-wrapper { width: 60%; }
    .sticky-header { padding: 18px 16px 14px 16px; font-size: 20px; letter-spacing: 8px; }
  }
</style>
</head>
<body>

<!-- 背景视频由 JS 动态创建，避免 HTML 标签被夸克等浏览器拦截 -->

<div class="bg-veil"></div>

<div class="wrapper">

  <header class="sticky-header"><a href="index.html" class="header-link">二十一一</a><span class="header-sep">&amp;</span><a href="https://www.xiqianyangyi.com/feed" class="header-link-external">二六</a></header>

  <main class="feed" id="feedContainer">
    <div class="feed-loading" id="feedLoading">
      <div class="feed-loading-inner">加载中…</div>
    </div>
  </main>

</div>

<script>
(function() {
  // ═══════════════════════════════════════════════
  // JS 动态创建背景视频 — 绕过浏览器 HTML 解析拦截
  // ═══════════════════════════════════════════════
  var bgVideo = document.createElement('video');
  bgVideo.id = 'bgVideo';
  bgVideo.className = 'video-bg';
  bgVideo.src = 'bg_video.mp4';
  bgVideo.muted = true;
  bgVideo.loop = true;
  bgVideo.autoplay = true;
  bgVideo.playsInline = true;
  bgVideo.setAttribute('webkit-playsinline', '');
  bgVideo.setAttribute('x5-video-player-type', 'h5-page');
  bgVideo.setAttribute('x5-video-player-fullscreen', 'false');
  bgVideo.setAttribute('x5-video-orientation', 'portrait');
  bgVideo.setAttribute('disablePictureInPicture', '');
  bgVideo.setAttribute('disableRemotePlayback', '');
  bgVideo.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
  bgVideo.setAttribute('oncontextmenu', 'return false');
  bgVideo.setAttribute('preload', 'auto');
  bgVideo.setAttribute('playsinline', '');

  // 插入到 body 最前面
  document.body.insertBefore(bgVideo, document.body.firstChild);

  // 尝试自动播放
  function tryPlay() {
    var p = bgVideo.play();
    if (p) {
      p.catch(function() {
        document.addEventListener('touchstart', playOnTouch, { once: true });
        document.addEventListener('click', playOnTouch, { once: true });
      });
    }
  }

  function playOnTouch() {
    bgVideo.play().catch(function(){});
  }

  tryPlay();

  // 页面从后台恢复时续播
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && bgVideo.paused) {
      bgVideo.play().catch(function(){});
    }
  });

  // ═══════════════════════════════════════════════
  // 动态加载帖子
  // ═══════════════════════════════════════════════
  var container = document.getElementById('feedContainer');
  var loadingEl = document.getElementById('feedLoading');

  function renderPosts(posts) {
    loadingEl.remove();

    if (!posts || posts.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'feed-empty';
      empty.textContent = '还没有帖子';
      container.appendChild(empty);
      return;
    }

    posts.forEach(function(post, index) {
      var item = document.createElement('div');
      item.className = 'feed-item';

      // 第一项初始可见
      if (index === 0) {
        item.classList.add('visible');
        item.style.marginTop = '24px';
        item.style.opacity = '1';
        item.style.transform = 'none';
        item.style.filter = 'none';
      }

      // 媒体元素
      var mediaItems = post.media;
      // 兼容旧数据
      if (!mediaItems || mediaItems.length === 0) {
        mediaItems = [{ type: post.mediaType, url: post.mediaUrl }];
      }

      // 多图轮播（全部是图片 & 数量 > 1）
      var allImages = mediaItems.every(function(m) { return m.type === 'image'; });
      if (allImages && mediaItems.length > 1) {
        var carousel = document.createElement('div');
        carousel.className = 'media-carousel';
        mediaItems.forEach(function(m) {
          var img = document.createElement('img');
          img.src = m.url;
          img.alt = '';
          img.loading = 'lazy';
          img.onerror = function() {
            img.style.background = '#1a1a1a';
            img.style.minHeight = '160px';
          };
          carousel.appendChild(img);
        });
        item.appendChild(carousel);
      } else if (mediaItems[0].type === 'video') {
        // 单个视频
        var vidWrapper = document.createElement('div');
        vidWrapper.className = 'video-wrapper';

        var video = document.createElement('video');
        video.className = 'feed-image';
        video.src = mediaItems[0].url;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('x5-video-player-type', 'h5-page');
        video.setAttribute('x5-video-player-fullscreen', 'false');
        video.setAttribute('controlsList', 'nodownload nofullscreen');

        var playBtn = document.createElement('div');
        playBtn.className = 'play-btn';

        vidWrapper.appendChild(video);
        vidWrapper.appendChild(playBtn);
        item.appendChild(vidWrapper);

        setupVideoControls(video, playBtn);
      } else {
        // 单张图片
        var img = document.createElement('img');
        img.className = 'feed-image';
        img.src = mediaItems[0].url;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function() {
          img.style.background = '#1a1a1a';
          img.style.minHeight = '160px';
        };
        item.appendChild(img);
      }

      // 日期
      var date = document.createElement('div');
      date.className = 'feed-date';
      date.innerHTML = post.date.replace(/ /, ' &nbsp; ');
      item.appendChild(date);

      // 文案
      if (post.caption) {
        var caption = document.createElement('div');
        caption.className = 'feed-caption';
        caption.textContent = post.caption;
        item.appendChild(caption);
      }

      container.appendChild(item);
    });

    // 启动淡入动画观察器
    setupScrollObserver();
  }

  // ── 视频控制 ──
  function setupVideoControls(video, btn) {
    video.muted = true;
    video.loop = true;

    video.play().catch(function() {
      btn.classList.remove('hidden');
    });

    function toggleVideo() {
      if (video.paused) {
        video.muted = false;
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener('touchstart', function(e) {
      e.preventDefault();
      toggleVideo();
    });

    video.addEventListener('click', function(e) {
      e.preventDefault();
      toggleVideo();
    });

    video.addEventListener('play', function() {
      if (!video.muted) btn.classList.add('hidden');
    });
    video.addEventListener('pause', function() { btn.classList.remove('hidden'); });
    video.addEventListener('ended', function() { btn.classList.remove('hidden'); });
  }

  // ── 滚动淡入淡出（双向） ──
  function setupScrollObserver() {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, { threshold: 0.01, rootMargin: '0px 0px 40px 0px' });

    var items = container.querySelectorAll('.feed-item');
    items.forEach(function(item, i) {
      if (i === 0) return;
      observer.observe(item);
    });
  }

  // ── 从 API 拉取 ──
  fetch('/api/get-posts')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(posts) {
      renderPosts(posts);
    })
    .catch(function(err) {
      console.error('加载帖子失败:', err);
      loadingEl.innerHTML = '<div class="feed-empty">加载失败，请刷新重试</div>';
    });
})();
</script>


</body>
</html>
